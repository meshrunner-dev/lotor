# Strict baseline: everything on, then a curated list of exceptions —
# each disable is either pure style noise or a rule that fights the
# nature of this repo (a hardware driver full of register bytes, with
# transcript-heavy tests).
version: "2"

linters:
  default: all
  disable:
    # Style opinions with no defect-finding value.
    - nlreturn
    - wsl
    # Radio drivers and protocols register themselves database/sql
    # style: package registries filled from init are the design.
    - gochecknoglobals
    - gochecknoinits
    # Config validation speaks to humans in full sentences; the errors
    # callers branch on are proper sentinels regardless.
    - err113
    - wsl_v5
    - varnamelen
    - ireturn
    # A curated allowlist for three dependencies would be overkill;
    # depguard stays enabled for the one seam that must not be crossed
    # (see settings below).
    - gomodguard
    - gomodguard_v2
    # Demand every struct literal list all fields; zero values are
    # idiomatic Go and kill readable tests.
    - exhaustruct
    - exhaustruct_v5
    # `if err := f(); err != nil` is the language's own idiom.
    - noinlineerr
    # A register map is legitimately full of magic numbers; naming each
    # would only push the datasheet reference one hop away.
    - mnd
    # Same-package tests are deliberate: the transcript harness drives
    # unexported internals (the device layer, the expiry clock).
    - testpackage
    # A driver returns its own sentinel errors; wrapping every stdlib
    # error would bloat the API surface.
    - wrapcheck
    # Tests share one scripted chip per case and are sequential by
    # construction.
    - paralleltest
    # Files are ordered by lifecycle narrative (Open next to its init
    # helpers, Configure next to its apply), not by visibility.
    - funcorder
    # Multi-value returns of one type ((rssi, snr), (preamble, header),
    # (lo, hi)) need names to be documentable, and AssessChannel's
    # named error is load-bearing for its restore-on-every-path defer.
    - nonamedreturns

  settings:
    depguard:
      rules:
        # The wire protocol lives in the library, not in this daemon.
        # Hand-packing a format here means it exists twice, and the two
        # copies drift. Adding it upstream costs one function.
        wire-formats-belong-upstream:
          files:
            - "**/internal/protocol/meshcore/*.go"
            - "!$test"
          deny:
            - pkg: encoding/binary
              desc: "wire formats belong in meshrunner.dev/pkg/meshcore — add the codec there and consume it (see AGENTS.md)"
        # The hardware world stops at the driver adapter. Everything
        # above it speaks radio.Device and this daemon's own types; a
        # chip config, a GPIO line or an ioctl surfacing in a protocol
        # engine, a relay or the console is a seam giving way, however
        # convenient the reading it was fetching.
        hardware-stops-at-the-driver:
          files:
            - "$all"
            - "!**/internal/radio/sx126x/*.go"
          deny:
            - pkg: meshrunner.dev/pkg/lora
              desc: "chip and channel types stop at internal/radio/sx126x — upper layers speak radio.Device (see AGENTS.md)"
            - pkg: github.com/warthog618/go-gpiocdev
              desc: "GPIO belongs to the driver module, not to this daemon"
            - pkg: periph.io
              desc: "GPIO and SPI belong to the driver module, not to this daemon"
            - pkg: golang.org/x/sys/unix
              desc: "low-level OS calls belong to the driver module, not to this daemon"
        # And the driver package itself is part of that world: only the
        # wiring in cmd/ names a concrete driver, because everything
        # else must keep working when a second one is registered.
        only-the-wiring-names-a-driver:
          files:
            - "$all"
            - "!**/cmd/lotor/*.go"
          deny:
            - pkg: meshrunner.dev/lotor/internal/radio/sx126x
              desc: "depend on the radio.Driver registry, not on one driver (see AGENTS.md)"
    errcheck:
      # Best-effort writes to interactive streams (CLI sessions): a dead
      # transport surfaces on the next read, not on every print.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    # Config files speak snake_case — the convention every preset and
    # example uses.
    tagliatelle:
      case:
        rules:
          yaml: snake
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # G115 (integer truncation): a register driver truncates by
        # design — every conversion is masked or bounds-checked against
        # the field width the datasheet gives it.
        - G115
    cyclop:
      max-complexity: 20
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 120
    revive:
      rules:
        - name: exported
          disabled: false
    gochecknoglobals: {}

  exclusions:
    rules:
      # The observer JSON schemas are the ecosystem's wire contract:
      # snake_case and capitalised keys as the consumers already parse
      # them. Restyling the tags would be publishing a different
      # protocol.
      - path: ^internal/mqtt/payload\.go$
        linters: [tagliatelle]

      # CLI declaration tags (kong) carry inline help texts that cannot
      # wrap.
      - linters: [lll]
        source: '`.*(cmd|arg|help|enum|placeholder):'

      # cmd/ tools are CLIs: printing to stdout is their purpose.
      - path: ^cmd/
        linters:
          - forbidigo

      # Lookup tables (IRQ names, device-error names, TCXO voltages,
      # band calibration columns) are package-level by nature.
      - linters: [gochecknoglobals]
        source: 'Names = |tcxoVoltages|agcCal|paTable'

      # The ioctl layer is what the unsafe package exists for; every
      # conversion is pinned and commented.
      - path: ^linux/spi\.go$
        linters: [gosec]

      # The compiled quickstart: it exists so the toolchain keeps the
      # README honest, not to run — there is no hardware in CI to
      # assert output against, and log.Fatal after defer is the honest
      # shape of a main-like example.
      - path: ^example_linux_test\.go$
        linters:
          - testableexamples
          - gocritic

      # Test files: pinned byte transcripts trip length and duplication
      # linters by design.
      - path: _test\.go
        linters:
          - gosec
          - dupl
          - funlen
          - gochecknoglobals
          - goconst
          - lll
          - maintidx
          - err113
          - errcheck
          - cyclop
          - gocognit
          - gocyclo

formatters:
  enable:
    - gofmt

    # (see linters.settings below)
