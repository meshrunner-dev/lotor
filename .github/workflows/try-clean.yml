# Sweep the fast train's bucket: try manifests older than two weeks
# go, and the version they point at goes with them; dev versions
# expire on the same clock, all but the one the live manifest names.
# The stable bucket is never touched — this job does not even hold a
# credential that could reach it. The manifest is the authority
# throughout: nothing a live manifest names is ever deleted.
name: try sweep
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The deploy key and the fast bucket's credentials live in the
    # environment only; the sweeper runs from main on a schedule,
    # which is exactly what fast admits.
    environment: fast
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Sweep stale try channels and dev versions
        env:
          DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: ./.github/scripts/sweep-fast.sh
