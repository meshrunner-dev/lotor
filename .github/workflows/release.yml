# The stable channels: a tag names a version, its suffix names the
# channel. A stable release also refreshes rc and beta — a less
# stable channel is never behind a more stable one; when it is ahead
# (a running beta cycle), the relays' own semver guard keeps them
# where they are and the next beta moves the channel forward again.
name: release channels
on:
  push:
    tags: ["v*"]

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      channels: ${{ steps.m.outputs.channels }}
      prerelease: ${{ steps.m.outputs.prerelease }}
    steps:
      - id: m
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *-rc.*)   channels="rc";              prerelease=true  ;;
            *-beta.*) channels="beta";            prerelease=true  ;;
            *-*)      echo "unknown pre-release suffix in $tag"; exit 1 ;;
            *)        channels="release rc beta"; prerelease=false ;;
          esac
          { echo "version=$tag"; echo "channels=$channels"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    # The stable train's key lives here, behind the environment's
    # protection rules: tags only, and a human approving the signing.
    environment: stable
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Refuse to publish unsigned channels
        run: grep -q "untrusted comment" internal/update/trust.go ||
          { echo "no embedded official key — mint one and embed it first"; exit 1; }
      - name: Create the release page
        # Notes for humans, an anchor for the tag — the binaries live
        # in the stable train's bucket, and only the manifests say so.
        run: |
          flags=(--generate-notes)
          [ "${{ needs.meta.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "$VERSION" "${flags[@]}"
      - name: Compress, sign, upload, publish
        env:
          RELSIGN_KEY: ${{ secrets.RELSIGN_KEY }}
          DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DL_BASE: ${{ vars.DL_BASE }}
        run: |
          # The bucket wiring is the environment's to provide — absent
          # values must fail here, in one line, not as a bent URL or a
          # cryptic aws error three steps later.
          : "${DL_BASE:?the environment must name its public download base}"
          for f in lotor_linux_arm64 lotor_linux_amd64 lotor_linux_arm; do
            mv "$f" "${f/lotor_/lotor_${VERSION}_}"
          done
          base="${DL_BASE}/lotor/${VERSION}"
          printf '%s' "$RELSIGN_KEY" > relsign.key
          # One manifest per channel first: relsign -gzip compresses and
          # hashes in one process, so the .gz files it writes are
          # byte-for-byte what every channel's signature vouches for.
          for channel in ${{ needs.meta.outputs.channels }}; do
            go run ./cmd/relsign manifest -gzip "$channel" "$VERSION" "manifest-${channel}.json" \
              "linux/arm64=${base}/lotor_${VERSION}_linux_arm64.gz=lotor_${VERSION}_linux_arm64" \
              "linux/amd64=${base}/lotor_${VERSION}_linux_amd64.gz=lotor_${VERSION}_linux_amd64" \
              "linux/arm=${base}/lotor_${VERSION}_linux_arm.gz=lotor_${VERSION}_linux_arm"
            go run ./cmd/relsign sign relsign.key "manifest-${channel}.json"
          done
          # Artifacts land before any manifest points at them: a
          # published channel never names bytes not yet there.
          for f in lotor_"${VERSION}"_linux_*.gz; do
            ./.github/scripts/s3-put-immutable.sh "lotor/${VERSION}/${f}" "$f"
          done
          for channel in ${{ needs.meta.outputs.channels }}; do
            cp "manifest-${channel}.json" manifest.json
            cp "manifest-${channel}.json.minisig" manifest.json.minisig
            ./.github/scripts/publish-manifests.sh "$channel"
          done
