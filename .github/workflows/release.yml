# The stable channels: a tag names a version, its suffix names the
# channel. A stable release also refreshes rc and beta — a less
# stable channel is never behind a more stable one; when it is ahead
# (a running beta cycle), the relays' own semver guard keeps them
# where they are and the next beta moves the channel forward again.
name: release channels
on:
  push:
    tags: ["v*"]

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      channels: ${{ steps.m.outputs.channels }}
      prerelease: ${{ steps.m.outputs.prerelease }}
    steps:
      - id: m
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *-rc.*)   channels="rc";              prerelease=true  ;;
            *-beta.*) channels="beta";            prerelease=true  ;;
            *-*)      echo "unknown pre-release suffix in $tag"; exit 1 ;;
            *)        channels="release rc beta"; prerelease=false ;;
          esac
          # The product version drops the tag's v prefix; the update
          # comparator tolerates both, so old manifests stay valid.
          { echo "version=${tag#v}"; echo "channels=$channels"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      expected_sha: ${{ github.sha }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    # The stable train's key lives here, behind the environment's
    # protection rules: tags only, and a human approving the signing.
    environment: stable
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRODUCT: ${{ needs.build.outputs.slug }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Refuse to publish unsigned channels
        run: grep -q "untrusted comment" internal/update/trust.go ||
          { echo "no embedded official key — mint one and embed it first"; exit 1; }
      - name: Prove the release reproduces
        # A second clean build of every target, compared byte-for-byte
        # with the artifacts about to ship: "officially reproducible"
        # is proved on the stable path itself, with the real version,
        # not on a laptop with a task nobody is obliged to run.
        run: |
          for t in arm64 amd64 arm; do
            goarm=""; [ "$t" = "arm" ] && goarm="7"
            ./scripts/build -o "repro_${t}" -version "$VERSION" \
              -goos linux -goarch "$t" -goarm "$goarm"
            cmp -s "repro_${t}" "${PRODUCT}_linux_${t}" \
              || { echo "linux/${t} does not reproduce byte-for-byte"; exit 1; }
            rm "repro_${t}"
          done
      - name: Create the release page
        # Notes for humans, an anchor for the TRIGGERING tag — gh
        # would silently mint a missing tag from the default branch,
        # which may not be the commit these binaries came from, so the
        # release names the ref that fired the workflow and refuses to
        # invent one. The v-less version stays the product's name; it
        # is not the tag's Git identity.
        run: |
          flags=(--generate-notes --verify-tag --title "$VERSION")
          [ "${{ needs.meta.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}"
      - name: Compress and sign
        env:
          RELSIGN_KEY: ${{ secrets.RELSIGN_KEY }}
          DL_BASE: ${{ vars.DL_BASE }}
        run: |
          # The bucket wiring is the environment's to provide — absent
          # values must fail here, in one line, not as a bent URL or a
          # cryptic aws error three steps later.
          : "${DL_BASE:?the environment must name its public download base}"
          for f in "${PRODUCT}_linux_arm64" "${PRODUCT}_linux_amd64" "${PRODUCT}_linux_arm"; do
            mv "$f" "${f/${PRODUCT}_/${PRODUCT}_${VERSION}_}"
          done
          base="${DL_BASE}/${PRODUCT}/${VERSION}"
          printf '%s' "$RELSIGN_KEY" > relsign.key
          # One manifest per channel first: relsign -gzip compresses and
          # hashes in one process, so the .gz files it writes are
          # byte-for-byte what every channel's signature vouches for.
          for channel in ${{ needs.meta.outputs.channels }}; do
            go run ./cmd/relsign manifest -gzip "$channel" "$VERSION" "manifest-${channel}.json" \
              "linux/arm64=${base}/${PRODUCT}_${VERSION}_linux_arm64.gz=${PRODUCT}_${VERSION}_linux_arm64" \
              "linux/amd64=${base}/${PRODUCT}_${VERSION}_linux_amd64.gz=${PRODUCT}_${VERSION}_linux_amd64" \
              "linux/arm=${base}/${PRODUCT}_${VERSION}_linux_arm.gz=${PRODUCT}_${VERSION}_linux_arm"
            go run ./cmd/relsign sign relsign.key "manifest-${channel}.json"
          done
          # The .gz is what relays download: prove the compression is
          # as deterministic as the build — the same relsign path over
          # the same binaries must mint the same distributed bytes.
          mkdir gzcheck
          for t in arm64 amd64 arm; do
            cp "${PRODUCT}_${VERSION}_linux_${t}" gzcheck/
          done
          ( cd gzcheck && go run ../cmd/relsign manifest -gzip probe "$VERSION" scratch.json \
              "linux/arm64=${base}/a.gz=${PRODUCT}_${VERSION}_linux_arm64" \
              "linux/amd64=${base}/b.gz=${PRODUCT}_${VERSION}_linux_amd64" \
              "linux/arm=${base}/c.gz=${PRODUCT}_${VERSION}_linux_arm" )
          for t in arm64 amd64 arm; do
            cmp -s "${PRODUCT}_${VERSION}_linux_${t}.gz" "gzcheck/${PRODUCT}_${VERSION}_linux_${t}.gz" \
              || { echo "linux/${t}.gz does not reproduce"; exit 1; }
          done
          rm -r gzcheck
      - name: Attest the distributed bytes
        # The attestation binds the .gz relays actually download to
        # repository, commit and workflow — after compression, before
        # anything is published. It complements Minisign; the updater's
        # root of trust stays the embedded key.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.gz"
      - name: Upload and publish
        env:
          DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          # Artifacts land before any manifest points at them: a
          # published channel never names bytes not yet there.
          for f in "${PRODUCT}_${VERSION}"_linux_*.gz; do
            ./.github/scripts/s3-put-immutable.sh "${PRODUCT}/${VERSION}/${f}" "$f"
          done
          for channel in ${{ needs.meta.outputs.channels }}; do
            cp "manifest-${channel}.json" manifest.json
            cp "manifest-${channel}.json.minisig" manifest.json.minisig
            ./.github/scripts/publish-manifests.sh "$channel"
          done
