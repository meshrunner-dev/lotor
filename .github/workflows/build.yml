# The one build every channel shares: a matrix of platforms, the
# version stamped into the binary, artifacts handed back to whichever
# workflow called. Channels differ in what they do with the result,
# never in how it was built — the recipe is scripts/build.sh, the same
# one `task build` runs on a laptop, and every binary is verified
# against its own embedded metadata before it leaves.
name: build
on:
  workflow_call:
    outputs:
      # The product slug, read from the source of truth so callers
      # never spell it: artifact names, S3 keys and URLs all derive
      # from this one output.
      slug:
        value: ${{ jobs.binaries.outputs.slug }}
    inputs:
      version:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      # expected_sha pins a mutable ref: after checkout, HEAD must be
      # exactly this commit — a branch that moved between jobs must
      # fail, not silently build something else under the same name.
      expected_sha:
        required: false
        type: string
        default: ""

jobs:
  binaries:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.meta.outputs.slug }}
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm, goarm: "7" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Pin the resolved commit
        if: inputs.expected_sha != ''
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "${{ inputs.expected_sha }}" ]; then
            echo "HEAD is $head, the caller resolved ${{ inputs.expected_sha }}"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Read the product identity
        id: meta
        run: echo "slug=$(go run ./internal/product/cmd/meta -field slug)" >> "$GITHUB_OUTPUT"
      - name: Prove the verifier itself
        # The verifier guards every train, so it is proved before it
        # judges: a canary build must pass under its own version and
        # FAIL under any other — a verifier that stopped seeing the
        # stamp would otherwise wave everything through. Once per run
        # is enough; the canary is the host's own architecture.
        #
        # It runs BEFORE the real build and writes outside the
        # checkout: -buildvcs stamps a tree holding an untracked file
        # as modified, so a canary built beside the real artifact
        # would carry vcs.modified=true and fail its own verification.
        if: matrix.goarch == 'amd64'
        run: |
          canary="${RUNNER_TEMP}/canary"
          ./scripts/build.sh -o "$canary" -version 9.9.9-canary
          ./.github/scripts/verify-binary.sh "$canary" "9.9.9-canary" \
            "$(git rev-parse HEAD)" "linux" "amd64" ""
          if ./.github/scripts/verify-binary.sh "$canary" "8.8.8-wrong" \
            "$(git rev-parse HEAD)" "linux" "amd64" "" 2>/dev/null; then
            echo "the verifier accepted a version the canary does not carry"; exit 1
          fi
          rm "$canary"
      - name: Build
        run: |
          ./scripts/build.sh -o "${{ steps.meta.outputs.slug }}_${{ matrix.goos }}_${{ matrix.goarch }}" \
            -version "${{ inputs.version }}" \
            -goos "${{ matrix.goos }}" -goarch "${{ matrix.goarch }}" \
            -goarm "${{ matrix.goarm }}"
      - name: Verify the binary against its own metadata
        run: |
          ./.github/scripts/verify-binary.sh \
            "${{ steps.meta.outputs.slug }}_${{ matrix.goos }}_${{ matrix.goarch }}" \
            "${{ inputs.version }}" "$(git rev-parse HEAD)" \
            "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ matrix.goarm }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.slug }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.meta.outputs.slug }}_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error
