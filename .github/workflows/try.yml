# The try channel: a manual build of any branch or PR, published like
# every other channel — an immutable version of its own in the fast
# train's bucket, never a release or a tag per build — and served
# under a channel named after its subject. try-clean sweeps the
# channels nobody refreshed for a while, and their versions with them.
name: try channel
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch name, or pr/<number>"
        required: true
        type: string

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.m.outputs.sha }}
      slug: ${{ steps.m.outputs.slug }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        # The mutable ref resolves to a SHA exactly ONCE, here; every
        # later job pins that SHA. The version's date is the commit's,
        # so a rerun of the same source mints the same identity.
        run: |
          ref="${{ inputs.ref }}"
          case "$ref" in
            pr/*) slug="pr-${ref#pr/}"; remote="refs/pull/${ref#pr/}/head" ;;
            *)    slug="branch-$(echo "$ref" | tr -c 'a-zA-Z0-9' '-' | tr -s '-' | sed 's/-$//')"
                  remote="refs/heads/$ref" ;;
          esac
          sha="$(git ls-remote origin "$remote" | cut -f1)"
          [ -n "$sha" ] || { echo "no commit at $remote"; exit 1; }
          git fetch --depth 1 origin "$sha"
          stamp="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S "$sha")"
          { echo "sha=$sha"; echo "slug=$slug"
            echo "version=0.0.0-try.${slug}.${stamp}.${sha::12}"; } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ needs.meta.outputs.sha }}
      expected_sha: ${{ needs.meta.outputs.sha }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment: fast
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SLUG: ${{ needs.meta.outputs.slug }}
      PRODUCT: ${{ needs.build.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Compress, sign, upload, publish
        env:
          RELSIGN_KEY: ${{ secrets.RELSIGN_KEY }}
          DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DL_BASE: ${{ vars.DL_BASE }}
        run: |
          # The bucket wiring is the environment's to provide — absent
          # values must fail here, in one line, not as a bent URL or a
          # cryptic aws error three steps later.
          : "${DL_BASE:?the environment must name its public download base}"
          # The version embeds the slug and the instant, so the names
          # need no slug of their own: one scheme for every channel.
          for f in "${PRODUCT}_linux_arm64" "${PRODUCT}_linux_amd64" "${PRODUCT}_linux_arm"; do
            mv "$f" "${f/${PRODUCT}_/${PRODUCT}_${VERSION}_}"
          done
          base="${DL_BASE}/${PRODUCT}/${VERSION}"
          printf '%s' "$RELSIGN_KEY" > relsign.key
          go run ./cmd/relsign manifest -gzip "try-${SLUG}" "$VERSION" manifest.json \
            "linux/arm64=${base}/${PRODUCT}_${VERSION}_linux_arm64.gz=${PRODUCT}_${VERSION}_linux_arm64" \
            "linux/amd64=${base}/${PRODUCT}_${VERSION}_linux_amd64.gz=${PRODUCT}_${VERSION}_linux_amd64" \
            "linux/arm=${base}/${PRODUCT}_${VERSION}_linux_arm.gz=${PRODUCT}_${VERSION}_linux_arm"
          go run ./cmd/relsign sign relsign.key manifest.json
          for f in "${PRODUCT}_${VERSION}"_linux_*.gz; do
            ./.github/scripts/s3-put-immutable.sh "${PRODUCT}/${VERSION}/${f}" "$f"
          done
          ./.github/scripts/publish-manifests.sh "try-${SLUG}"
