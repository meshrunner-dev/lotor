# The try channel: a manual build of any branch or PR, published like
# every other channel — an immutable version of its own in the fast
# train's bucket, never a release or a tag per build — and served
# under a channel named after its subject. try-clean sweeps the
# channels nobody refreshed for a while, and their versions with them.
name: try channel
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch name, or pr/<number>"
        required: true
        type: string

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.m.outputs.ref }}
      slug: ${{ steps.m.outputs.slug }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - id: m
        run: |
          ref="${{ inputs.ref }}"
          case "$ref" in
            pr/*) slug="pr-${ref#pr/}"; ref="refs/pull/${ref#pr/}/head" ;;
            *)    slug="branch-$(echo "$ref" | tr -c 'a-zA-Z0-9' '-' | tr -s '-' | sed 's/-$//')" ;;
          esac
          { echo "ref=$ref"; echo "slug=$slug"
            echo "version=0.1.0-try.${slug}.$(date -u +%Y%m%d%H%M%S)"; } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ needs.meta.outputs.ref }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment: fast
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SLUG: ${{ needs.meta.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Compress, sign, upload, publish
        env:
          RELSIGN_KEY: ${{ secrets.RELSIGN_KEY }}
          DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DL_BASE: ${{ vars.DL_BASE }}
        run: |
          # The version embeds the slug and the instant, so the names
          # need no slug of their own: one scheme for every channel.
          for f in lotor_linux_arm64 lotor_linux_amd64 lotor_linux_arm; do
            mv "$f" "${f/lotor_/lotor_${VERSION}_}"
          done
          base="${DL_BASE}/lotor/${VERSION}"
          printf '%s' "$RELSIGN_KEY" > relsign.key
          go run ./cmd/relsign manifest -gzip "try-${SLUG}" "$VERSION" manifest.json \
            "linux/arm64=${base}/lotor_${VERSION}_linux_arm64.gz=lotor_${VERSION}_linux_arm64" \
            "linux/amd64=${base}/lotor_${VERSION}_linux_amd64.gz=lotor_${VERSION}_linux_amd64" \
            "linux/arm=${base}/lotor_${VERSION}_linux_arm.gz=lotor_${VERSION}_linux_arm"
          go run ./cmd/relsign sign relsign.key manifest.json
          for f in lotor_"${VERSION}"_linux_*.gz; do
            ./.github/scripts/s3-put-immutable.sh "lotor/${VERSION}/${f}" "$f"
          done
          ./.github/scripts/publish-manifests.sh "try-${SLUG}"
