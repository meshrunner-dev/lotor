# The dev channel: every push to main becomes its own immutable
# version — gzipped objects in the fast train's bucket, keyed by that
# version, never overwritten and never reused — and a freshly signed
# manifest on the update host. Nothing rolls: history stays
# addressable, so pinning a relay on an older dev build to bisect a
# regression is one manifest away, and the weekly sweep is what
# forgets, deliberately, manifest in hand.
name: dev channel
on:
  push:
    branches: [main]
concurrency:
  group: dev-channel
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=0.1.0-dev.$(date -u +%Y%m%d%H%M%S).${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: fast
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Refuse to publish unsigned channels
        run: grep -q "untrusted comment" internal/update/trust.go ||
          { echo "no embedded official key — mint one and embed it first"; exit 1; }
      - name: Compress, sign, upload, publish
        env:
          RELSIGN_KEY: ${{ secrets.RELSIGN_KEY }}
          DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DL_BASE: ${{ vars.DL_BASE }}
        run: |
          for f in lotor_linux_arm64 lotor_linux_amd64 lotor_linux_arm; do
            mv "$f" "${f/lotor_/lotor_${VERSION}_}"
          done
          base="${DL_BASE}/lotor/${VERSION}"
          printf '%s' "$RELSIGN_KEY" > relsign.key
          # relsign -gzip compresses and hashes in one process: the .gz
          # files it writes are byte-for-byte what the signature vouches
          # for, and they are what gets uploaded.
          go run ./cmd/relsign manifest -gzip dev "$VERSION" manifest.json \
            "linux/arm64=${base}/lotor_${VERSION}_linux_arm64.gz=lotor_${VERSION}_linux_arm64" \
            "linux/amd64=${base}/lotor_${VERSION}_linux_amd64.gz=lotor_${VERSION}_linux_amd64" \
            "linux/arm=${base}/lotor_${VERSION}_linux_arm.gz=lotor_${VERSION}_linux_arm"
          go run ./cmd/relsign sign relsign.key manifest.json
          # Artifacts land before the manifest that names them: the
          # published channel never points at bytes not yet there.
          for f in lotor_"${VERSION}"_linux_*.gz; do
            ./.github/scripts/s3-put-immutable.sh "lotor/${VERSION}/${f}" "$f"
          done
          ./.github/scripts/publish-manifests.sh dev
