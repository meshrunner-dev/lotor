# Example: one MeshCore relay on an SX1262 HAT.
#
# Layering: `profile` selects a preset by name ("custom" starts from
# nothing), and `overrides` patches it — scoped by profile name, so
# switching profiles never drags the previous profile's tuning along.

radios:
  slot1:
    driver: sx126x-spi
    profile: rak6421-13300x-slot1
    overrides:
      rak6421-13300x-slot1:
        # The preset fixes what the PCB fixes; where the board sits on
        # THIS host is yours to say (gpiochip defaults to gpiochip0).
        spi: /dev/spidev0.0

# Optional: the sentinel journals every frame and verdict. Omit the
# whole block to run without observation (tight-RAM hosts); use
# journal: ":memory:" to observe without touching storage.
sentinel:
  journal: /var/lib/lotor/journal.db
  retention: 720h

# Optional: the operator CLI over telnet. Plaintext and read-only, so
# loopback by default; omit the block for no listener at all.
cli:
  listen: 127.0.0.1:2323

relays:
  meshcore-868:
    protocol: meshcore
    radio: slot1
    profile: eu-868-narrow
    overrides:
      eu-868-narrow:
        # Waveform comes from the preset; engine knobs are patchable.
        # The identity is this node's private key, inline: a seed from
        # `lotor identity new`, or the 64-byte prv.key hex of an
        # existing node to migrate it here. Guard this file: whoever
        # reads the key IS the node.
        # identity: <hex>

        # Transport scopes: which slice of the band's traffic this
        # relay carries. A scope is a mesh agreement, not a band fact —
        # two relays on eu-868-narrow may serve different ones. Absent,
        # the relay carries the plain mesh and is invisible to scoped
        # traffic, which is what an unconfigured node does.
        #
        #   default_scope:  what this relay stamps on what it
        #                   originates; must be one of accept_scopes
        #   accept_scopes:  whose scoped floods it relays
        #   accept_unscoped: whether plain floods move through it at
        #                   all (true unless said otherwise)
        # accept_scopes reads as a sequence or as one line — `[fr, be]`
        # and `fr, be` mean the same list, the second being the shape a
        # neighbour answers a scopes question in.
        # default_scope: fr
        # accept_scopes: [fr, be]
        # accept_unscoped: true

        # Guest sessions: whether a stranger may open a read-only
        # session over the air — status, telemetry, neighbours, owner.
        # Administration is not served over the air today: it happens
        # on the console socket, where the operating system's own
        # permissions authenticate.
        #
        #   guest_access: blocked   nobody may — the default
        #                 password  whoever knows guest_password may
        #                 open      anyone may, with no credential
        #   guest_password: the credential, and only with `password`
        #   session_limit: answers one session may make this relay
        #                 emit per minute (6 unless said otherwise).
        #                 Every answer costs airtime somewhere: a
        #                 flood until the client teaches a route home,
        #                 and after that one emission per repeater on
        #                 the way.
        # guest_access: password
        # guest_password: <secret>
        # session_limit: 6
